<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- pixel game controller -->
  <rect x="1" y="4" width="14" height="8" fill="currentColor"/>
  <rect x="3" y="3" width="10" height="1" fill="currentColor"/>
  <rect x="4" y="2" width="8" height="1" fill="currentColor"/>
  <!-- d-pad -->
  <rect x="3" y="6" width="1" height="3" fill="var(--bg,#0F1722)"/>
  <rect x="2" y="7" width="3" height="1" fill="var(--bg,#0F1722)"/>
  <!-- buttons -->
  <rect x="11" y="6" width="2" height="1" fill="var(--bg,#0F1722)"/>
  <rect x="12" y="7" width="1" height="2" fill="var(--bg,#0F1722)"/>
  <rect x="11" y="8" width="2" height="1" fill="var(--bg,#0F1722)"/>
  <!-- start/select -->
  <rect x="6" y="7" width="2" height="1" fill="var(--bg,#0F1722)"/>
  <rect x="9" y="7" width="2" height="1" fill="var(--bg,#0F1722)"/>
</svg>
